<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
<title id="title">The same agents, across the places you work</title>
<desc id="desc">Five experiences contain conversations: Companion, Slack, Teams, Amplifier and Minecraft. A coordinator's Instance contains its runtime and connects to both a Companion call and a Slack conversation. A researcher's Instance also connects to that Slack conversation and a Teams discussion. A specialist's Instance connects to Amplifier and Minecraft. Thus one individual can participate in multiple conversations and multiple individuals can share one conversation. Lines represent participation through supported connections, not shared permission or a mandatory deployment. Dashed lines connect Observatory to independent installations through authorized management interfaces. Conversation services support quiet, inspectable huddles. Engine choices include Constellation Runtime, Codex, Claude, GitHub Copilot and Amplifier Agent. Amplifier integration is planned.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183b42}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#4b6570}.name{font-size:25px;font-weight:650}.label{font-size:21px}.small{font-size:19px;fill:#4b6570}.eyebrow{font-size:17px;letter-spacing:1.4px;font-weight:600;fill:#4b6570}.connection{fill:none;stroke:#527982;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.home{fill:#e7f1ed;stroke:#679386;stroke-width:2}.experience{fill:#f6f2e9;stroke:#d3c9b3;stroke-width:2}.conversation{fill:white;stroke:#c8c9c1;stroke-width:1.5}
</style>
<rect width="1440" height="1230" rx="18" fill="#fcfbf7"/>
<text x="45" y="58" class="eyebrow">CONSTELLATION · PERSISTENT INDIVIDUALS, CONNECTED CONVERSATIONS</text>
<text x="45" y="115" class="title">The same agents, across the places you work.</text>
<text x="45" y="157" class="sub">Talk, collaborate and receive results where the work belongs.</text>
<text x="45" y="209" class="eyebrow">EXPERIENCES · EACH CONVERSATION KEEPS ITS AUDIENCE AND HISTORY</text>
