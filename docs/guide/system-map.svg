<rect x="48" y="691" width="436" height="123" rx="14" fill="#fff" class="planned"/>
<text x="68" y="725" class="label">Organize work and evidence</text>
<text x="68" y="756" class="body">Scheduling · Workspaces</text>
<text x="68" y="786" class="body">Resources · Operations</text>
<rect x="502" y="691" width="436" height="123" rx="14" fill="#fff" class="planned"/>
<text x="522" y="725" class="label">Create, release and carry</text>
<text x="522" y="756" class="body">Canvas · Publishing · Portability</text>
<text x="522" y="786" class="small">Compose reusable platform capabilities</text>
<rect x="956" y="691" width="436" height="123" rx="14" fill="#fff" class="planned"/>
<text x="976" y="725" class="label">Live and relevant input</text>
<text x="976" y="756" class="body">Realtime · Context</text>
<text x="976" y="786" class="small">Keep source access and engine ownership</text>

<path d="M48 839 H1392" class="line"/>
<text x="68" y="873" class="body"><tspan font-weight="700">ACP</tspan> client ↔ agent</text>
<text x="437" y="873" class="body"><tspan font-weight="700">MCP</tspan> permitted tools and context</text>
<text x="956" y="873" class="body"><tspan font-weight="700">Owned APIs</tspan> service capabilities</text>
<text x="48" y="919" class="eyebrow">OPTIONAL SUPPORT · EXISTING OWNERS</text>
<text x="48" y="950" class="body">Persona Workshop: profiles</text>
