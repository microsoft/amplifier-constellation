<text x="930" y="230" class="label">Other experiences and ACP clients</text>
<text x="930" y="259" class="body">Slack · Teams · Minecraft · future products</text>
<text x="930" y="283" class="small">Use supported connections and interfaces</text>

<rect x="48" y="315" width="1344" height="73" rx="14" fill="#fff" class="planned"/>
<text x="70" y="343" class="eyebrow">CLIENT FOUNDATIONS · PLANNED HOMES</text>
<text x="70" y="372" class="body">Web · Windows · macOS · Linux · iOS · Android</text>
<text x="740" y="372" class="small">Reusable client support; product choices stay with products</text>

<path d="M720 396 L720 426" class="line" marker-end="url(#arrow)"/>
<text x="744" y="417" class="small">Compose only the capabilities the experience needs</text>
