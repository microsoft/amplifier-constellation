<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Amplifier ecosystem: products compose shared capabilities</title>
<desc id="desc">Companion has a planned independent product repository; its preview exists. Amplifier Unified is an existing product with a planned Constellation integration. Slack, Teams, Minecraft and other experiences connect through their supported boundaries. Six planned client-foundation homes cover web, Windows, macOS, Linux, iOS and Android. Existing agent, conversation and domain services sit alongside nine planned reusable platform capabilities: scheduling, workspaces, resources, operations, canvas, publishing, portability, realtime and context. Products select the capabilities they need through ACP, MCP and owned service APIs. This is an intended ownership map, not a claim of implemented integrations or a required deployment stack.</desc>
<defs>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172f3d}
.eyebrow{font-size:15px;font-weight:750;letter-spacing:1.8px;fill:#536971}
.title{font-size:43px;font-weight:750;letter-spacing:-1px}
.sub{font-size:22px;fill:#536971}
.label{font-size:23px;font-weight:700}
.body{font-size:20px;fill:#405761}
.small{font-size:17px;fill:#536971}
.line{stroke:#b4c5c6;stroke-width:2;fill:none}
.planned{stroke:#a99b78;stroke-width:2;stroke-dasharray:6 5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#799291" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="1050" fill="#f5f3ec"/>
<text x="48" y="43" class="eyebrow">AMPLIFIER ECOSYSTEM · PRODUCTS AND SHARED CAPABILITIES</text>
<text x="48" y="94" class="title">Different experiences. Reuse the foundation.</text>
<text x="48" y="130" class="sub">Products own the experience; shared owners deepen reusable capabilities.</text>

