<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">Constellation: one foundation, many experiences</title>
<desc id="desc">Experiences including Slack, Teams, Minecraft, planned Amplifier Unified integration, future web or native products and ACP clients can compose independently owned services. Four major responsibilities are installed identity and management, reasoning and execution, conversation and context services, and domain connections. ACP connects clients and engines. MCP exposes authorized tools and context. Owned service APIs compose and manage capabilities. Profiles, evaluation and fleet administration are optional supporting capabilities. This is a conceptual map, not a mandatory stack or deployment topology.</desc>
<defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#172f3d }
    .eyebrow { font-size:15px; font-weight:750; letter-spacing:2px; fill:#536971 }
    .title { font-size:45px; font-weight:750; letter-spacing:-1px }
    .sub { font-size:22px; fill:#536971 }
    .label { font-size:22px; font-weight:700 }
    .body { font-size:20px; fill:#405761 }
    .small { font-size:17px; fill:#536971 }
    .line { stroke:#b4c5c6; stroke-width:2; fill:none }
  </style>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#799291" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="1050" fill="#f5f3ec"/>
<text x="48" y="45" class="eyebrow">AMPLIFIER CONSTELLATION · THE SERVICE FOUNDATION</text>
<text x="48" y="102" class="title">One foundation. Many experiences.</text>
<text x="48" y="139" class="sub">Reuse agent capabilities while leaving product UX open to design.</text>

<text x="48" y="192" class="eyebrow">WHERE PEOPLE AND SOFTWARE CONNECT</text>
