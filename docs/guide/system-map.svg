<text x="70" y="283" class="small">Independent repo planned; preview exists</text>
<rect x="478" y="196" width="410" height="100" rx="14" fill="#fff" stroke="#dddcd4"/>
<text x="500" y="230" class="label">Amplifier Unified</text>
<text x="500" y="259" class="body">Existing product and its experiences</text>
<text x="500" y="283" class="small">Constellation connection planned</text>
