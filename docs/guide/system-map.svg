  <text x="1086" y="490" class="small">SLACK · TEAMS · MINECRAFT · …</text>
  <text x="1086" y="531" class="body">Source identity &amp; delivery</text>
  <text x="1086" y="563" class="body">Platform access &amp; actions</text>
  <text x="1086" y="595" class="body">Outcomes &amp; recovery</text>
  <text x="1086" y="640" class="small">The domain owns its effects</text>
</g>
<line x1="56" y1="691" x2="1384" y2="691" stroke="#dedfd8"/>
<text x="68" y="731" class="body"><tspan font-weight="750">ACP</tspan><tspan>  client ↔ agent</tspan></text>
