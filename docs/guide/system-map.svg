  <text x="340" y="248" class="label">Minecraft</text><text x="340" y="279" class="small">Connected world</text>
  <rect x="588" y="213" width="264" height="88" rx="16" fill="#fff" stroke="#a99b78" stroke-dasharray="5 5"/>
  <text x="610" y="248" class="label">Amplifier Unified</text><text x="610" y="279" class="small">Integration planned</text>
  <rect x="872" y="213" width="250" height="88" rx="16" fill="#fff" stroke="#dddcd4"/>
