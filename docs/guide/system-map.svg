<text x="976" y="731" class="body"><tspan font-weight="750">Service APIs</tspan><tspan>  compose &amp; operate</tspan></text>

<text x="48" y="816" class="eyebrow">OPTIONAL SUPPORT · USE WHAT HELPS</text>
<rect x="48" y="838" width="424" height="107" rx="16" fill="#ebece7"/>
<text x="70" y="878" class="label">Persona Workshop</text><text x="70" y="906" class="small">Portable communication profiles</text><text x="70" y="930" class="small">and working styles</text>
<rect x="508" y="838" width="424" height="107" rx="16" fill="#ebece7"/>
<text x="530" y="878" class="label">ACP Lab</text><text x="530" y="906" class="small">Collaboration trials &amp; independent checks</text>
<rect x="968" y="838" width="424" height="107" rx="16" fill="#ebece7"/>
<text x="990" y="878" class="label">Observatory</text><text x="990" y="906" class="small">Operate independent installations</text>
<text x="48" y="991" class="small">No required central service. An ACP client can use a compatible engine directly.</text>
<text x="48" y="1020" class="small">Conceptual capability map, not a mandatory stack, deployment topology or finished UX.</text>
