  <rect x="1142" y="213" width="250" height="88" rx="16" fill="#fff" stroke="#dddcd4"/>
  <text x="1164" y="248" class="label">Other ACP clients</text><text x="1164" y="279" class="small">Compatible agent access</text>
</g>
<path d="M173 302 V315 H1267 V302 M443 302 V315 M720 302 V350 M997 302 V315" class="line"/><path d="M720 338 V350" class="line" marker-end="url(#arrow)"/>
<text x="746" y="342" class="small">Choose the capabilities the experience needs</text>

<rect x="32" y="365" width="1376" height="404" rx="25" fill="#fff" stroke="#dedfd8"/>
