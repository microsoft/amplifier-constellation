<text x="956" y="950" class="body">Observatory: administration</text>
<text x="48" y="993" class="small">Dashed outlines mark planned homes and adoption, not available APIs or completed extraction.</text>
<text x="48" y="1021" class="small">Intended ownership map. No required central service, mandatory stack or prescribed product UX.</text>
