name: Native installation driver
on:
  pull_request:
    paths: ['crates/native-platform/**', 'crates/native-platform-driver/**', 'support/python/constellation_native/**', 'tests/native_python/**', '.github/workflows/native-python.yml']
  push:
    branches: [main]
    paths: ['crates/native-platform/**', 'crates/native-platform-driver/**', 'support/python/constellation_native/**', 'tests/native_python/**', '.github/workflows/native-python.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-installation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the frozen actual Instance caller
        uses: actions/checkout@v4
        env:
          # Compare exact Git blobs on every OS, independent of runner settings.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: microsoft/amplifier-constellation-instance
          ref: 39807674755dff153de372b3311e08a006ba7174
          path: _qualification/instance
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Keep the Windows driver independent of the Visual C++ redistributable
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import os, subprocess
          host = next(line.removeprefix('host: ') for line in subprocess.check_output(['rustc', '+1.93.0', '-vV'], text=True).splitlines() if line.startswith('host: '))
          expected = {'X64': 'x86_64-pc-windows-msvc', 'ARM64': 'aarch64-pc-windows-msvc'}[os.environ['RUNNER_ARCH']]
          if host != expected:
              raise SystemExit(f'Unexpected Windows Rust host: {host}; expected {expected}')
          # Explicit host target keeps these flags off build scripts/proc macros.
          # This remains the debug build executed by all qualification below.
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARGO_BUILD_TARGET='+host+'\n')
              output.write('RUSTFLAGS=-C target-feature=+crt-static\n')
          PY
      - name: Format and lint the serving source
        run: |
          cargo +1.93.0 fmt --manifest-path crates/native-platform/Cargo.toml --check
          cargo +1.93.0 fmt --manifest-path crates/native-platform-driver/Cargo.toml --check
          cargo +1.93.0 clippy --manifest-path crates/native-platform/Cargo.toml --locked --all-targets --features installation -- -D warnings
          cargo +1.93.0 clippy --manifest-path crates/native-platform-driver/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build and exercise native locks, process generations and owned endpoints
        run: |
          cargo +1.93.0 test --manifest-path crates/native-platform/Cargo.toml --locked --features installation
          cargo +1.93.0 test --manifest-path crates/native-platform-driver/Cargo.toml --locked
          cargo +1.93.0 test --manifest-path crates/native-platform/Cargo.toml --locked --features installation --example windows_service_fixture
          cargo +1.93.0 build --manifest-path crates/native-platform-driver/Cargo.toml --locked
          cargo +1.93.0 build --manifest-path crates/native-platform/Cargo.toml --locked --features installation --example windows_service_fixture
          cargo +1.93.0 build --manifest-path crates/native-platform/Cargo.toml --locked --features installation --example operation_lifetime_fixture
      - name: Inspect the library and bind the exact Instance caller before Python tests
        run: |
          python - <<'PY'
          import ctypes, hashlib, json, os, pathlib, platform, subprocess, sys
          pin_path = pathlib.Path('tests/native_python/fixtures/worker_source.json')
          pin = json.loads(pin_path.read_text(encoding='utf-8'))
          expected = {
              'repository': 'https://github.com/microsoft/amplifier-constellation-instance',
              'commit': '39807674755dff153de372b3311e08a006ba7174',
              'path': 'ops/updates/worker.py',
              'sha256': '0cf607145339af51cc049f1dc2be04a860d7ce9cac7001f0d75bb4b925e53ed7',
              'environment': 'CONSTELLATION_INSTANCE_SOURCE',
          }
          if any(pin.get(key) != value for key, value in expected.items()):
              raise SystemExit('Instance fixture pin and reviewed workflow checkout differ')
          instance = (pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '_qualification/instance').resolve(strict=True)
          observed = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=instance, text=True).strip()
          tracked_changes = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], cwd=instance, text=True)
          worker = instance / expected['path']
          if observed != expected['commit'] or tracked_changes or hashlib.sha256(worker.read_bytes()).hexdigest() != expected['sha256']:
              raise SystemExit('Actual Instance checkout differs from its immutable qualification pin')
          pathlib.Path('native-worker-source-result.json').write_text(json.dumps({
              'schema': 1, 'instance_source': str(instance), 'pin': pin,
              'pin_sha256': hashlib.sha256(pin_path.read_bytes()).hexdigest(),
              'observed_commit': observed, 'worker_sha256': expected['sha256'],
              'production_operations': False,
          }, indent=2)+'\n', encoding='utf-8')
          name = {'Windows': 'constellation_native_driver.dll', 'Darwin': 'libconstellation_native_driver.dylib', 'Linux': 'libconstellation_native_driver.so'}[platform.system()]
          target = pathlib.Path('target') / os.environ.get('CARGO_BUILD_TARGET', '') / 'debug'
          library_path = (pathlib.Path('crates/native-platform-driver') / target / name).resolve(strict=True)
          digest = hashlib.sha256(library_path.read_bytes()).hexdigest()
          # Retain the actual artifact even if metadata inspection or loading
          # fails; exporting its path does not qualify it or bypass any check.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CONSTELLATION_NATIVE_LIBRARY='+str(library_path)+'\n')
              output.write('CONSTELLATION_NATIVE_LIBRARY_SHA256='+digest+'\n')
              output.write('CONSTELLATION_INSTANCE_SOURCE='+str(instance)+'\n')
          subprocess.run([sys.executable, 'tests/native_python/inspect_library.py', '--library', str(library_path), '--output', 'native-session-library-inspection.json'], check=True)
          library = ctypes.CDLL(str(library_path))
          library.constellation_native_abi_version.argtypes = []
          library.constellation_native_abi_version.restype = ctypes.c_uint32
          if library.constellation_native_abi_version() != 1:
              raise SystemExit('Actual loaded native library does not implement ABI 1')
          if hashlib.sha256(library_path.read_bytes()).hexdigest() != digest:
              raise SystemExit('Native library changed during loading')
          pathlib.Path('native-session-library-result.json').write_text(json.dumps({
              'schema': 1, 'os': platform.system(), 'architecture': platform.machine(),
              'library': str(library_path), 'sha256': digest, 'abi': 1,
              'coverage': 'actual hosted Python ABI-1 library loading; actual lock/Worker tests follow; packaged Python and connector lifecycle qualification are separate',
          }, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Test Python through the actual driver and library
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, unittest
          suffix = '.exe' if os.name == 'nt' else ''
          target = pathlib.Path('target') / os.environ.get('CARGO_BUILD_TARGET', '') / 'debug'
          path = (pathlib.Path('crates/native-platform-driver') / target / ('constellation-native-driver' + suffix)).resolve()
          fixture = (pathlib.Path('crates/native-platform') / target / 'examples' / ('windows_service_fixture' + suffix)).resolve()
          operation = (pathlib.Path('crates/native-platform') / target / 'examples' / ('operation_lifetime_fixture' + suffix)).resolve()
          registration_tests = [p.resolve() for p in (pathlib.Path('crates/native-platform') / target / 'deps').glob('native_registration-*' + suffix) if p.is_file() and os.access(p, os.X_OK) and not p.name.endswith('.d')]
          if len(registration_tests) != 1:
              raise SystemExit(f'Expected one actual native registration test executable: {registration_tests}')
          registration = registration_tests[0]
          subprocess.run([sys.executable, 'tests/native_python/inspect_driver.py', '--driver', str(path), '--output', 'native-installation-result.json'], check=True)
          subprocess.run([sys.executable, 'tests/native_python/inspect_driver.py', '--driver', str(fixture), '--output', 'native-service-fixture-result.json'], check=True)
          subprocess.run([sys.executable, 'tests/native_python/inspect_driver.py', '--driver', str(operation), '--output', 'native-operation-fixture-result.json'], check=True)
          subprocess.run([sys.executable, 'tests/native_python/inspect_driver.py', '--driver', str(registration), '--output', 'native-registration-test-result.json'], check=True)
          env = dict(os.environ, CONSTELLATION_NATIVE_DRIVER=str(path), NATIVE_TEST_PYTHON=sys.executable, NATIVE_SERVICE_FIXTURE=str(fixture))
          for required in ('CONSTELLATION_NATIVE_LIBRARY', 'CONSTELLATION_NATIVE_LIBRARY_SHA256', 'CONSTELLATION_INSTANCE_SOURCE'):
              if not env.get(required):
                  raise SystemExit('Missing actual in-process qualification input: '+required)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CONSTELLATION_NATIVE_DRIVER='+str(path)+'\n')
              output.write('PYTHON='+sys.executable+'\n')
              output.write('NATIVE_SERVICE_FIXTURE='+str(fixture)+'\n')
              output.write('NATIVE_OPERATION_LIFETIME_FIXTURE='+str(operation)+'\n')
              output.write('NATIVE_REGISTRATION_TESTS='+str(registration)+'\n')
          try:
              # Record the same discovery run, including required new bootstrap
              # outcomes. A skipped materializer test is not target proof.
              os.environ.update(env)
              class RecordedResult(unittest.TextTestResult):
                  def __init__(self, *args, **kwargs):
                      super().__init__(*args, **kwargs)
                      self.passed = []
                  def addSuccess(self, test):
                      self.passed.append(test.id())
                      super().addSuccess(test)
              result = unittest.TextTestRunner(verbosity=2, resultclass=RecordedResult).run(
                  unittest.defaultTestLoader.discover('tests/native_python')
              )
              required = [
                  'ActualDriverSetupTests.test_private_driver_materialization_opens_actual_native_session',
                  'ActualDriverSetupTests.test_existing_private_driver_is_read_only_validation',
                  'ActualDriverSetupTests.test_driver_materialization_refuses_public_or_nonexecutable_target',
                  'ActualDriverSetupTests.test_driver_materialization_refuses_private_conflict_without_repair',
                  'ActualDriverSetupTests.test_wrong_driver_digest_creates_no_target_and_preserves_parent',
                  'ActualDriverSetupTests.test_driver_materialization_requires_existing_protected_parent',
              ]
              if os.name == 'nt':
                  required.extend([
                      'ActualDriverSetupTests.test_driver_materialization_owner_and_dacl_on_long_unicode_path',
                      'ActualDriverSetupTests.test_driver_materialization_refuses_foreign_owner_without_repair',
                  ])
              missing = [name for name in required if sum(test.endswith('.'+name) for test in result.passed) != 1]
              record = {
                  'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'tests_run': result.testsRun, 'passed': result.passed,
                  'skipped': [{'test': test.id(), 'reason': reason} for test, reason in result.skipped],
                  'failures': [test.id() for test, _ in result.failures],
                  'errors': [test.id() for test, _ in result.errors],
                  'required_bootstrap': required, 'missing_bootstrap_passes': missing,
                  'successful': result.wasSuccessful() and not missing,
              }
              pathlib.Path('native-python-discovery-result.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
              if not record['successful']:
                  raise SystemExit('Native Python discovery or required private-driver bootstrap did not pass')
          finally:
              subprocess.run([sys.executable, 'tests/native_python/inspect_library.py', '--library', env['CONSTELLATION_NATIVE_LIBRARY'], '--output', 'native-session-library-inspection.json', '--verify'], check=True)
          PY
      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Actual native service capture, drift, start, stop and independent pause
        env:
          CONSTELLATION_INSTALLATION_SMOKE: '1'
        run: |
          cargo +1.93.0 test --manifest-path crates/native-platform/Cargo.toml --locked --features installation --test native_installation -- --ignored --nocapture
          cargo +1.93.0 test --manifest-path crates/native-platform/Cargo.toml --locked --features installation --test native_registration -- --ignored --nocapture --test-threads=1
      - name: Actual operation worker survives parent and retires without stopping replacement
        env:
          CONSTELLATION_INSTALLATION_SMOKE: '1'
        run: |
          export NATIVE_OPERATION_SOURCE="$(git rev-parse HEAD)"
          export NATIVE_OPERATION_LIFETIME_RESULT="$GITHUB_WORKSPACE/native-operation-lifetime-result.json"
          mkdir "$GITHUB_WORKSPACE/native-operation-evidence"
          export NATIVE_OPERATION_TEST_ROOT="$GITHUB_WORKSPACE/native-operation-evidence"
          cargo +1.93.0 test --manifest-path crates/native-platform/Cargo.toml --locked --features installation --test operation_lifetime -- --ignored --nocapture 2>&1 | tee native-operation-lifetime.log
          python tests/native_python/inspect_driver.py --driver "$NATIVE_OPERATION_LIFETIME_FIXTURE" --output native-operation-fixture-result.json --verify
          python tests/native_python/inspect_driver.py --driver "$NATIVE_REGISTRATION_TESTS" --output native-registration-test-result.json --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-operation-lifetime-${{ matrix.runner }}
          path: |
            native-operation-fixture-result.json
            native-registration-test-result.json
            native-operation-lifetime-result.json
            native-operation-lifetime.log
            native-operation-evidence/
            ${{ env.NATIVE_OPERATION_LIFETIME_FIXTURE }}
            ${{ env.NATIVE_REGISTRATION_TESTS }}
          if-no-files-found: warn
      - name: Actual fresh no-start registration and controller identity through Python
        env:
          CONSTELLATION_INSTALLATION_SMOKE: '1'
        run: python -m unittest discover -s tests/native_python -p test_service.py -v
      - name: Qualify exact Minecraft packaged Python against the same driver
        if: runner.os == 'Windows'
        env:
          CONSTELLATION_INSTALLATION_SMOKE: '1'
        run: |
          python tests/native_python/run_packaged_python.py \
          --target ${{ runner.arch == 'ARM64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }} \
          --output native-packaged-python-result.json \
          --log native-packaged-python.log
          python - <<'PY'
          import json, pathlib
          ordinary = json.loads(pathlib.Path('native-python-discovery-result.json').read_text(encoding='utf-8'))
          packaged = json.loads(pathlib.Path('native-packaged-python-result.json').read_text(encoding='utf-8'))
          required = ordinary['required_bootstrap']
          passed = packaged['tests']['passed']
          missing = [name for name in required if sum(test.endswith('.'+name) for test in passed) != 1]
          record = {'source': ordinary['source'], 'required_bootstrap': required, 'missing_bootstrap_passes': missing,
                    'packaged_python_sha256': packaged['tests']['executable_sha256'],
                    'successful': packaged['outcome'] == 'passed' and not missing}
          pathlib.Path('native-packaged-bootstrap-result.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          if not record['successful']:
              raise SystemExit('Required private-driver bootstrap did not pass under packaged Python')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: native-packaged-python-${{ matrix.runner }}
          path: |
            native-packaged-python-result.json
            native-packaged-python.log
            native-packaged-bootstrap-result.json
          if-no-files-found: warn
      - name: Qualify one actual 60000-entry regenerable tree
        run: >-
          python tests/native_python/run_tree_scale.py
          --output native-tree-scale-result.json
          --cleanup-timeout 120
          2>&1 | tee native-tree-scale.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tree-scale-${{ matrix.runner }}
          path: |
            native-tree-scale-result.json
            native-tree-scale.log
          if-no-files-found: warn
      - name: Verify executed native artifacts and the frozen Instance caller
        if: always() && env.CONSTELLATION_NATIVE_DRIVER != '' && env.CONSTELLATION_NATIVE_LIBRARY != ''
        run: |
          python tests/native_python/inspect_driver.py --driver "$CONSTELLATION_NATIVE_DRIVER" --output native-installation-result.json --verify
          python tests/native_python/inspect_driver.py --driver "$NATIVE_SERVICE_FIXTURE" --output native-service-fixture-result.json --verify
          python tests/native_python/inspect_library.py --library "$CONSTELLATION_NATIVE_LIBRARY" --output native-session-library-inspection.json --verify
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          record = json.loads(pathlib.Path('native-worker-source-result.json').read_text(encoding='utf-8'))
          pin_path = pathlib.Path('tests/native_python/fixtures/worker_source.json')
          pin = json.loads(pin_path.read_text(encoding='utf-8'))
          instance = pathlib.Path(os.environ['CONSTELLATION_INSTANCE_SOURCE']).resolve(strict=True)
          observed = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=instance, text=True).strip()
          tracked_changes = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], cwd=instance, text=True)
          worker_sha256 = hashlib.sha256((instance / 'ops/updates/worker.py').read_bytes()).hexdigest()
          if (pin != record['pin'] or hashlib.sha256(pin_path.read_bytes()).hexdigest() != record['pin_sha256']
                  or str(instance) != record['instance_source'] or observed != record['observed_commit']
                  or tracked_changes or worker_sha256 != record['worker_sha256']):
              raise SystemExit('Frozen Instance source or fixture manifest changed during qualification')
          record['observed_commit_after'] = observed
          record['worker_sha256_after'] = worker_sha256
          record['verified_after_qualification'] = True
          pathlib.Path('native-worker-source-result.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-installation-${{ matrix.runner }}
          path: |
            native-installation-result.json
            native-service-fixture-result.json
            native-session-library-result.json
            native-session-library-inspection.json
            native-worker-source-result.json
            native-python-discovery-result.json
            tests/native_python/fixtures/worker_source.json
            ${{ env.CONSTELLATION_INSTANCE_SOURCE }}/ops/updates/worker.py
            ${{ env.CONSTELLATION_NATIVE_DRIVER }}
            ${{ env.CONSTELLATION_NATIVE_LIBRARY }}
            ${{ env.NATIVE_SERVICE_FIXTURE }}
          if-no-files-found: error
