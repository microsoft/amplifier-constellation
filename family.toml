publication = "source"
purpose = "Person-specific communication and working-style profiles, evaluation, and portable exports."

[[component]]
id = "slack"
repository = "https://github.com/microsoft/amplifier-acp-slack"
scope = "shared"
publication = "source"
purpose = "Generic ACP integration with Slack conversations and presentation."

[[component]]
id = "teams"
repository = "https://github.com/microsoft/amplifier-acp-teams"
scope = "shared"
publication = "source"
purpose = "Generic ACP integration with Teams conversations, platform authorization, and presentation."

[[component]]
id = "lab"
repository = "https://github.com/microsoft/amplifier-acp-lab"
scope = "shared"
publication = "source"
