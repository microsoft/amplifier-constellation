[package]
name = "amplifier-native-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Local per-user storage, startup and desktop launch support for Constellation applications"
repository = "https://github.com/microsoft/amplifier-constellation"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5.3", optional = true }
hmac = { version = "0.12", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"] }
url = "2"

[features]
default = []
local-auth = ["dep:argon2", "dep:hmac", "dep:rand_core", "dep:sha2"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "startup_output"
harness = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
