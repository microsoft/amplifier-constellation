[package]
name = "amplifier-acp-connection"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Bounded Tokio integration for the official ACP Rust SDK"
repository = "https://github.com/microsoft/amplifier-constellation"

[dependencies]
agent-client-protocol = "=5.0.0"
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
futures-channel = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
